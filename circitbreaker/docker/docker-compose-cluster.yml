# layered cache 실험용 Redis Cluster (master 3 + replica 3, 포트 7001~7006)
# Redis 스터디 프로젝트(Redis/docker/docker-compose-cluster.yml) 구성 기반.
# 노드는 host.docker.internal:700x 로 자신을 알리고, 호스트의 /etc/hosts 가 host.docker.internal -> 127.0.0.1 이라
# 호스트의 앱도 그대로 접속된다. MySQL 은 docker-compose.yml 을 함께 띄운다.
#
#   docker compose -f docker/docker-compose.yml up -d mysql
#   docker compose -f docker/docker-compose-cluster.yml up -d
#
# 주의: Redis 스터디 프로젝트의 클러스터(7001~7006)와 포트가 같으므로 동시에 띄우지 않는다.
name: circuitbreaker-redis-cluster

x-redis-node: &redis-node
  image: redis:7-alpine
  # 실험 데이터만 사용하므로 영속화 비활성화
  command: >
    sh -c 'redis-server --port $$REDIS_PORT --cluster-enabled yes
    --cluster-config-file nodes.conf --cluster-node-timeout 5000
    --bind 0.0.0.0 --protected-mode no --save "" --appendonly no'
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p $$REDIS_PORT ping | grep PONG"]
    interval: 1s
    timeout: 1s
    retries: 30
  networks:
    - cluster-network

services:
  cb-redis-node-1: { <<: *redis-node, container_name: cb-redis-node-1, environment: { REDIS_PORT: "7001" }, ports: ["7001:7001", "17001:17001"] }
  cb-redis-node-2: { <<: *redis-node, container_name: cb-redis-node-2, environment: { REDIS_PORT: "7002" }, ports: ["7002:7002", "17002:17002"] }
  cb-redis-node-3: { <<: *redis-node, container_name: cb-redis-node-3, environment: { REDIS_PORT: "7003" }, ports: ["7003:7003", "17003:17003"] }
  cb-redis-node-4: { <<: *redis-node, container_name: cb-redis-node-4, environment: { REDIS_PORT: "7004" }, ports: ["7004:7004", "17004:17004"] }
  cb-redis-node-5: { <<: *redis-node, container_name: cb-redis-node-5, environment: { REDIS_PORT: "7005" }, ports: ["7005:7005", "17005:17005"] }
  cb-redis-node-6: { <<: *redis-node, container_name: cb-redis-node-6, environment: { REDIS_PORT: "7006" }, ports: ["7006:7006", "17006:17006"] }

  cb-redis-cluster-init:
    image: redis:7-alpine
    container_name: cb-redis-cluster-init
    depends_on:
      cb-redis-node-1: { condition: service_healthy }
      cb-redis-node-2: { condition: service_healthy }
      cb-redis-node-3: { condition: service_healthy }
      cb-redis-node-4: { condition: service_healthy }
      cb-redis-node-5: { condition: service_healthy }
      cb-redis-node-6: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c 'redis-cli -h host.docker.internal -p 7001 cluster info | grep -q "cluster_state:ok" && echo "cluster already created" && exit 0;
      redis-cli --cluster create host.docker.internal:7001 host.docker.internal:7002 host.docker.internal:7003
      host.docker.internal:7004 host.docker.internal:7005 host.docker.internal:7006 --cluster-replicas 1 --cluster-yes'
    networks:
      - cluster-network

networks:
  cluster-network:
    driver: bridge

name: Redis-study

services:
  redis:
    image: redis:7-alpine
    container_name: jonghyun-redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - study-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: jonghyun-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - study-network

  mysql:
    image: mysql:8.0
    container_name: jonghyun-redis-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: redisdb
      MYSQL_USER: jonghyun-mysql
      MYSQL_PASSWORD: jonghyun-mysql
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - study-network

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: jonghyun-mysql-exporter
    restart: unless-stopped
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    command:
      - --config.my-cnf=/.my.cnf
      - --collect.perf_schema.eventsstatementssum
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: jonghyun-benchmark-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - redis-exporter
      - mysql-exporter
    networks:
      - study-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: jonghyun-benchmark-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - study-network

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  study-network:
    driver: bridge
